var calcAge=function(birthday){
  if(!birthday)return null;
  var parts=birthday.split('-');

function calcMonthlyCastKPI(data,castId,yearMonth){
  var records=(data.records||{})[castId]||[];
  var monthly=records.filter(function(r){return r.date&&r.date.slice(0,7)===yearMonth;});
  var lastYM=getPrevMonth(yearMonth);

function buildCustomerData(data,castId){
  var visits=(data.customers||{})[castId]||[];
  var grouped={};
  visits.forEach(function(v){
    if(!v.name)return;
    if(!grouped[v.name])grouped[v.name]={name:v.name,dates:[],types:[]};
    grouped[v.name].dates.push(v.date);
    grouped[v.name].types.push(v.type||'');
  });
  return Object.keys(grouped).map(function(k){
    var c=grouped[k];
    var sorted=c.dates.map(function(d){return new Date(d);}).sort(function(a,b){return b-a;});
    var avgInterval=30;
    if(sorted.length>=2){
      var intervals=[];
      for(var i=0;i<sorted.length-1;i++){intervals.push(Math.floor((sorted[i]-sorted[i+1])/86400000));}
      avgInterval=Math.round(intervals.reduce(function(a,b){return a+b;},0)/intervals.length);
    }
    return{name:c.name,nominationType:c.types[0]||'不明',visitCount:sorted.length,lastVisitDate:sorted[0]?sorted[0].toISOString().split('T')[0]:null,averageVisitInterval:avgInterval};
  }).filter(function(c){return c.lastVisitDate!==null;});
}

// キャストが指定月に所属していたフォルダIDを返す
function getCastFolderAt(cast,mk){
  if(!cast.folderHistory||cast.folderHistory.length===0){
    return null; // 履歴なし = 現在のフォルダで管理
  }
  // mkより前で最新のhistoryエントリを返す
  var sorted=cast.folderHistory.slice().sort(function(a,b){return a.from.localeCompare(b.from);});
  var result=null;
  for(var i=0;i<sorted.length;i++){
    if(sorted[i].from<=mk)result=sorted[i].folderId;
    else break;
  }
  return result;
}

function aggregate(records,castId,mode){
  var rows=records[castId]||[];var map={};
  rows.forEach(function(r){
    var key=mode==='daily'?r.date:mode==='monthly'?r.date.slice(0,7):r.date.slice(0,4);
    if(!map[key])map[key]={key:key,sales:0,companions:0,nominations:0,workDays:0,floorCount:0};
    map[key].sales+=Number(r.sales||0);map[key].companions+=Number(r.companions||0);
    map[key].nominations+=Number(r.nominations||0);map[key].workDays+=1;map[key].floorCount+=Number(r.floorCount||0);
  });
  return Object.values(map).sort(function(a,b){return a.key.localeCompare(b.key);});
}

function ShiftPage(p){
  var now=new Date();if(now.getHours()<9)now.setDate(now.getDate()-1);
  var s1=useState(now.getFullYear()+'-'+pad(now.getMonth()+1));var currentYM=s1[0];var setCurrentYM=s1[1];
  var s2=useState('week');var viewMode=s2[0];var setViewMode=s2[1];
  var s3=useState('');var query=s3[0];var setQuery=s3[1];
  var s_sf=useState('all');var selShiftFolder=s_sf[0];var setSelShiftFolder=s_sf[1];
  var s4=useState(null);var editCell=s4[0];var setEditCell=s4[1];
  var s5=useState({status:'work',time:''});var editVal=s5[0];var setEditVal=s5[1];
  var s6=useState(false);var aiLoading=s6[0];var setAiLoading=s6[1];
  var s7=useState('');var aiResult=s7[0];var setAiResult=s7[1];
  var s8=useState(false);var showAI=s8[0];var setShowAI=s8[1];
  var s9=useState(function(){var d=new Date();d.setDate(d.getDate()-d.getDay());return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());});
  var weekStart=s9[0];var setWeekStart=s9[1];
  var s10=useState(false);var showCalView=s10[0];var setShowCalView=s10[1];
  var s_sd=useState(null);var selDayIdx=s_sd[0];var setSelDayIdx=s_sd[1];
  // カレンダービューでタップした日
  var s11=useState(null);var calSelDate=s11[0];var setCalSelDate=s11[1];
  // 定数シフト設定（曜日ごと）: {0:3,1:4,...} 日=0〜土=6
  var s12=useState(p.data.quota||{});var quotaMap=s12[0];var setQuotaMap=s12[1];
  var s13=useState(false);var showQuota=s13[0];var setShowQuota=s13[1];

  var shifts=p.data.shifts||{};
  var ymParts=currentYM.split('-');var yr=Number(ymParts[0]);var mo=Number(ymParts[1]);
  var daysInMonth=new Date(yr,mo,0).getDate();
  var dayLabels=['日','月','火','水','木','金','土'];

  function getWeekDates(){
    var dates=[];var d=new Date(weekStart);
    for(var i=0;i<7;i++){dates.push(d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()));d.setDate(d.getDate()+1);}
    return dates;
  }
  function prevWeek(){var d=new Date(weekStart);d.setDate(d.getDate()-7);setWeekStart(d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()));}
  function nextWeek(){var d=new Date(weekStart);d.setDate(d.getDate()+7);setWeekStart(d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()));}
  function prevMonth(){var d=new Date(yr,mo-2,1);setCurrentYM(d.getFullYear()+'-'+pad(d.getMonth()+1));}
  function nextMonth(){var d=new Date(yr,mo,1);setCurrentYM(d.getFullYear()+'-'+pad(d.getMonth()+1));}

  var shiftRooms=useMemo(function(){
    var seen=new Set();var result=[];
    (p.data.folders||[]).filter(function(f){return !f._leftRoom;}).forEach(function(f){
      var rid=f._roomId||'__none__';
      if(!seen.has(rid)){seen.add(rid);result.push({rid:rid,label:f._roomId?((p.roomsList||[]).find(function(r){return r.roomId===f._roomId;})||{}).name||f.name:p.userName||f.name});}
    });
    result.sort(function(a,b){return a.rid==='__none__'?1:b.rid==='__none__'?-1:0;});
    return result;
  },[p.data.folders,p.roomsList]);
  var filteredCasts=useMemo(function(){
    var myIds=new Set();
    (p.data.folders||[]).filter(function(f){return !f._archived&&!f._leftRoom&&f.ownerUid&&f.ownerUid===p.uid;}).forEach(function(f){(f.castIds||[]).forEach(function(id){myIds.add(id);});});
    var q=query.trim().toLowerCase();
    var base=p.data.casts.filter(function(c){return !c._archived&&!c._leftRoom&&myIds.has(c.id);});
    if(q)base=base.filter(function(c){return c.name.toLowerCase().includes(q);});
    if(selShiftFolder==='all')return base;
    var roomFolders=(p.data.folders||[]).filter(function(f){return(f._roomId||'__none__')===selShiftFolder;});
    var castIds=new Set();roomFolders.forEach(function(f){(f.castIds||[]).forEach(function(cid){castIds.add(cid);});});
    return base.filter(function(c){return castIds.has(c.id);});
  },[p.data.casts,query,selShiftFolder,p.data.folders,p.uid]);

  function getShift(castId,date){return(shifts[castId]||{})[date]||null;}
  function saveQuota(){
    p.persist(Object.assign({},p.data,{quota:quotaMap}));
    setShowQuota(false);
  }
  function setShiftData(castId,date,val){
    var ns=Object.assign({},shifts);
    if(!ns[castId])ns[castId]={};
    if(val===null){delete ns[castId][date];}else{ns[castId][date]=val;}
    p.persist(Object.assign({},p.data,{shifts:ns}));
  }
  function openEdit(castId,date){var cur=getShift(castId,date);setEditCell({castId:castId,date:date});setEditVal(cur||{status:'work',time:''});}
  function saveEdit(){setShiftData(editCell.castId,editCell.date,editVal);setEditCell(null);}
  function clearShift(){setShiftData(editCell.castId,editCell.date,null);setEditCell(null);}

  // 当月の曜日別出勤数と定数の差異を計算
  // 今週の曜日別出勤人数を計算
  var weekdayDiff=useMemo(function(){
    // 今週（weekDates）の各日の出勤人数
    var wdates=getWeekDates();
    return Array(7).fill(0).map(function(_,i){
      var date=wdates[i];
      var cnt=p.data.casts.reduce(function(sum,c){
        var sh=getShift(c.id,date);
        return sum+(sh&&(sh.status==='work'||sh.status==='douhan')?1:0);
      },0);
      var quota=Number(quotaMap[i]||0);
      return{day:dayLabels[i],quota:quota,actual:cnt,diff:quota>0?(cnt-quota):null};
    });
  },[shifts,p.data.casts,weekStart,quotaMap]);

      var roomFolderIds=new Set(folders.map(function(f){return f.id;}));
      (pd.casts||[]).forEach(function(c){
        if(!roomCastIds.has(c.id)){

      Object.keys(pd.records||{}).forEach(function(k){if(!roomCastIds.has(k))records[k]=pd.records[k];});
      Object.keys(pd.customers||{}).forEach(function(k){if(!roomCastIds.has(k))customers[k]=pd.customers[k];});

          var arch=!!f._archived;

  function notify(msg,type){setToast({msg:msg,type:type||'success'});setTimeout(function(){setToast(null);},2800);}

  function setupApprovalListener(uid,rid,roomName,inviteCode){
    if(pendingListenersRef.current[rid])return;
    var started=false;
    var unsub=db.collection('rooms').doc(rid).collection('joinRequests').doc(uid).onSnapshot(function(doc){
      if(!started){started=true;if(doc.exists)return;} // 初回: 申請が既に消えている場合のみ続行
      else if(doc.exists)return; // 申請がまだある → 待機
      // 申請が消えた → 承認 or 拒否を確認
      var fn=pendingListenersRef.current[rid];if(fn){fn();}
      delete pendingListenersRef.current[rid];
      var upd={};upd[rid]=firebase.firestore.FieldValue.delete();
      db.collection('users').doc(uid).collection('meta').doc('pendingJoins').update(upd).catch(function(){});
      db.collection('rooms').doc(rid).collection('members').doc(uid).get().then(function(mem){
        if(!mem.exists){return;} // 拒否された
        var md=mem.data();
        db.collection('users').doc(uid).collection('rooms').doc(rid).set({
          name:roomName,role:md.role||'member',inviteCode:inviteCode,joinedAt:md.joinedAt||new Date().toISOString()
        }).then(function(){
          setSettingsPage('room');
          notify(roomName+'に参加しました');
        }).catch(function(){
          setSettingsPage('room');
          notify(roomName+'に参加しました');
        });
      }).catch(function(){
        // members読み取り失敗（遅延・ルール）→ デフォルトで書き込んで画面遷移
        db.collection('users').doc(uid).collection('rooms').doc(rid).set({
          name:roomName,role:'member',inviteCode:inviteCode,joinedAt:new Date().toISOString()
        }).then(function(){
          setSettingsPage('room');
          notify(roomName+'に参加しました');
        }).catch(function(){
          setSettingsPage('room');
        });
      });
    },function(){});
    pendingListenersRef.current[rid]=unsub;
  }

  function submitMiniJoinRequest(onSuccess,codeOverride){
    var code=(codeOverride!==undefined?codeOverride:miniJoinInput).trim().toUpperCase();
    if(!code){setMiniJoinMsg('招待コードを入力してください');return;}
    var match=code.match(/[A-Z2-9]{6}/);
    var actualCode=match?match[0]:code;
    setMiniJoinLoading(true);setMiniJoinMsg('');
    db.collection('rooms').where('inviteCode','==',actualCode).limit(1).get().then(function(snap){
      if(snap.empty){setMiniJoinMsg('招待コードが見つかりません');setMiniJoinLoading(false);return;}
      var rid=snap.docs[0].id;
      var roomInfo=snap.docs[0].data();
      if(roomInfo.inviteCodeExpiresAt&&new Date(roomInfo.inviteCodeExpiresAt)<new Date()){setMiniJoinMsg('招待コードの有効期限が切れています。管理者に再発行してもらってください。');setMiniJoinLoading(false);return;}
      db.collection('rooms').doc(rid).collection('members').doc(user.uid).get().then(function(mem){
        if(mem.exists){setMiniJoinMsg('すでに参加済みです');setMiniJoinLoading(false);return;}
        db.collection('rooms').doc(rid).collection('joinRequests').doc(user.uid).get().then(function(req){
          if(req.exists){setMiniJoinMsg('申請中です。管理者の承認をお待ちください。');setMiniJoinLoading(false);return;}
          db.collection('rooms').doc(rid).collection('joinRequests').doc(user.uid).set({
            uid:user.uid,userName:userName||'',requestedAt:new Date().toISOString(),status:'pending'
          }).then(function(){
            setMiniJoinInput('');setMiniJoinLoading(false);
            var pj={};pj[rid]={name:roomInfo.name||'',inviteCode:roomInfo.inviteCode||''};
            db.collection('users').doc(user.uid).collection('meta').doc('pendingJoins').set(pj,{merge:true}).catch(function(){});
            setupApprovalListener(user.uid,rid,roomInfo.name||'',roomInfo.inviteCode||'');
            if(typeof onSuccess==='function'){onSuccess();}
            else{setSettingsPage(null);notify('参加申請を送りました。管理者の承認をお待ちください。');}
          }).catch(function(){setMiniJoinMsg('申請に失敗しました');setMiniJoinLoading(false);});
        });
      });
    }).catch(function(){setMiniJoinMsg('申請に失敗しました');setMiniJoinLoading(false);});
  }
  function persist(next){
    setData(next);
    if(!user)return;
    // personal items → users/{uid}/data/main
    var personalCasts=(next.casts||[]).filter(function(c){return c._personal;});
    var personalCastIds=new Set(personalCasts.map(function(c){return c.id;}));
    var personalFolders=(next.folders||[]).filter(function(f){return f._personal;});
    var personalVisits=(next.visits||[]).filter(function(v){return v._personal;});
    if(personalCasts.length>0||personalFolders.length>0||personalVisits.length>0){
      var cleanPC=personalCasts.map(function(c){var cc=Object.assign({},c);delete cc._personal;return cc;});
      var cleanPF=personalFolders.map(function(f){var ff=Object.assign({},f);delete ff._personal;return ff;});
      var cleanPV=personalVisits.map(function(v){var vv=Object.assign({},v);delete vv._personal;return vv;});
      var pRec={};Object.keys(next.records||{}).forEach(function(k){if(personalCastIds.has(k))pRec[k]=next.records[k];});
      var pCus={};Object.keys(next.customers||{}).forEach(function(k){if(personalCastIds.has(k))pCus[k]=next.customers[k];});
      var pShift={};Object.keys(next.shifts||{}).forEach(function(k){if(personalCastIds.has(k))pShift[k]=next.shifts[k];});
      db.collection('users').doc(user.uid).collection('data').doc('main').set({casts:cleanPC,records:pRec,customers:pCus,folders:cleanPF,shifts:pShift,visits:cleanPV,quota:{}}).catch(function(e){console.error('Personal save error:',e);});
    }
    var map=roomDataMapRef.current;
    var rids=Object.keys(map);
    if(rids.length===0){
      var npCasts=(next.casts||[]).filter(function(c){return !c._personal;});
      if(npCasts.length>0){var np=Object.assign({},next,{casts:npCasts,folders:(next.folders||[]).filter(function(f){return !f._personal;})});saveToDB(user.uid,np);}
      return;
    }
    var primaryRid=primaryRoomRef.current||rids[0];
    var castRoomMap={};
    rids.forEach(function(rid){((map[rid]||{}).casts||[]).forEach(function(c){castRoomMap[c.id]=rid;});});
    (next.casts||[]).forEach(function(c){if(!c._personal&&c._roomId&&!castRoomMap[c.id])castRoomMap[c.id]=c._roomId;});
    var folderRoomMap={};
    rids.forEach(function(rid){((map[rid]||{}).folders||[]).forEach(function(f){folderRoomMap[f.id]=rid;});});
    (next.folders||[]).forEach(function(f){if(!f._personal&&f._roomId&&!folderRoomMap[f.id])folderRoomMap[f.id]=f._roomId;});
    rids.forEach(function(rid){
      var roomCastIds=new Set(Object.keys(castRoomMap).filter(function(cid){return castRoomMap[cid]===rid;}));
      var roomCasts=(next.casts||[]).filter(function(c){return !c._personal&&(roomCastIds.has(c.id)||(rid===primaryRid&&!castRoomMap[c.id]));}).map(function(c){var cc=Object.assign({},c);delete cc._roomId;return cc;});
      var roomRecords={};Object.keys(next.records||{}).forEach(function(cid){if(!personalCastIds.has(cid)&&(roomCastIds.has(cid)||(rid===primaryRid&&!castRoomMap[cid])))roomRecords[cid]=next.records[cid];});
      var roomCustomers={};Object.keys(next.customers||{}).forEach(function(cid){if(!personalCastIds.has(cid)&&(roomCastIds.has(cid)||(rid===primaryRid&&!castRoomMap[cid])))roomCustomers[cid]=next.customers[cid];});
      var roomShifts={};Object.keys(next.shifts||{}).forEach(function(cid){if(!personalCastIds.has(cid)&&(roomCastIds.has(cid)||(rid===primaryRid&&!castRoomMap[cid])))roomShifts[cid]=next.shifts[cid];});
      var roomFolderIds=new Set(Object.keys(folderRoomMap).filter(function(fid){return folderRoomMap[fid]===rid;}));
      var roomFolders=(next.folders||[]).filter(function(f){return !f._personal&&(roomFolderIds.has(f.id)||(rid===primaryRid&&!folderRoomMap[f.id]));}).map(function(f){var ff=Object.assign({},f);delete ff._roomId;return ff;});
      var roomVisits=(next.visits||[]).filter(function(v){return !v._personal&&(v._roomId?v._roomId===rid:rid===primaryRid);}).map(function(v){var vv=Object.assign({},v);delete vv._roomId;return vv;});
      db.collection('rooms').doc(rid).collection('data').doc('main').set({casts:roomCasts,records:roomRecords,customers:roomCustomers,folders:roomFolders,shifts:roomShifts,visits:roomVisits,quota:next.quota||{}}).catch(function(e){console.error('Save error:',e);});
    });
  }
