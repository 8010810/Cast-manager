  if(!birthday)return null;
  var parts=birthday.split('-');
  var now=new Date();var bd=new Date(Number(parts[0]),Number(parts[1])-1,Number(parts[2]));

function getCastFolderAt(cast,mk){
  if(!cast.folderHistory||cast.folderHistory.length===0){
    return null; // 履歴なし = 現在のフォルダで管理
  }
  // mkより前で最新のhistoryエントリを返す
  var sorted=cast.folderHistory.slice().sort(function(a,b){return a.from.localeCompare(b.from);});
  var result=null;
  for(var i=0;i<sorted.length;i++){
    if(sorted[i].from<=mk)result=sorted[i].folderId;
    else break;
  }
  return result;
}

function aggregate(records,castId,mode){
  var rows=records[castId]||[];var map={};
  rows.forEach(function(r){
    var key=mode==='daily'?r.date:mode==='monthly'?r.date.slice(0,7):r.date.slice(0,4);
    if(!map[key])map[key]={key:key,sales:0,companions:0,nominations:0,workDays:0,floorCount:0};
    map[key].sales+=Number(r.sales||0);map[key].companions+=Number(r.companions||0);
    map[key].nominations+=Number(r.nominations||0);map[key].workDays+=1;map[key].floorCount+=Number(r.floorCount||0);
  });
  return Object.values(map).sort(function(a,b){return a.key.localeCompare(b.key);});
}

  static getDerivedStateFromError(error){return{hasError:true,error:error};}
  render(){
    if(this.state.hasError){
      return React.createElement('div',{style:{padding:'20px',color:'#ff6b6b',background:'#1a0000',borderRadius:'12px',margin:'20px',fontSize:'12px',wordBreak:'break-all'}},
        React.createElement('div',{style:{fontWeight:700,marginBottom:'8px'}},'ERROR:'),
        React.createElement('div',null,String(this.state.error))
      );
    }
    return this.props.children;
  }
}

function FolderMKDetail(p){

function MyCastPage(p){
  var s1=useState(null);var editFolderId=s1[0];var setEditFolderId=s1[1];
  var s2=useState('');var folderName=s2[0];var setFolderName=s2[1];
  // openFolderをAppから受け取る（castページから戻った時に復元）
  var openFolder=p.openFolderProp||null;
  var setOpenFolder=p.setOpenFolderProp||function(){};
  var s4=useState(false);var showAddFolder=s4[0];var setShowAddFolder=s4[1];
  var s_efm=useState(false);var editFolderMode=s_efm[0];var setEditFolderMode=s_efm[1];
  var s_sel=useState({});var selectedCastIds=s_sel[0];var setSelectedCastIds=s_sel[1];
  var s_tgt=useState('');var targetFolderId=s_tgt[0];var setTargetFolderId=s_tgt[1];

  var folders=p.data.folders||[];

  // フォルダ開いた時にsubBackを設定
  React.useEffect(function(){
    if(!p.isActive)return; // castページ表示中は上書きしない
    if(p.onSetSubBack){
      if(openFolder){
        p.onSetSubBack(function(){setOpenFolder(null);return false;});
      } else {
        p.onSetSubBack(null);
      }
    }
  },[openFolder,p.isActive]);

  function moveCastsToFolder(){
    if(!targetFolderId)return;
    var ids=Object.keys(selectedCastIds).filter(function(id){return selectedCastIds[id];});
    if(ids.length===0)return;
    var now2=new Date();var curMK=now2.getFullYear()+'-'+pad(now2.getMonth()+1);
    var newCasts=p.data.casts.map(function(c){
      if(!ids.includes(c.id))return c;
      // folderHistory更新
      var existingHist=c.folderHistory||[];
      var currentFolder=(p.data.folders||[]).find(function(f){return(f.castIds||[]).includes(c.id);});
      var currentFolderId=currentFolder?currentFolder.id:null;
      if(existingHist.length===0&&currentFolderId){
        var allRecs=(p.data.records[c.id]||[]);
        var firstMonth=allRecs.length>0?allRecs.slice().sort(function(a,b){return a.date.localeCompare(b.date);})[0].date.slice(0,7):'2020-01';
        existingHist=[{folderId:currentFolderId,from:firstMonth}];
      }
      var hist=existingHist.filter(function(h){return h.from!==curMK;});
      hist.push({folderId:targetFolderId,from:curMK});
      return Object.assign({},c,{folderHistory:hist});
    });
    var newFolders=(p.data.folders||[]).map(function(f){
      var newIds=(f.castIds||[]).filter(function(id){return!ids.includes(id);});
      if(f.id===targetFolderId)newIds=newIds.concat(ids.filter(function(id){return!newIds.includes(id);}));
      return Object.assign({},f,{castIds:newIds});
    });
    p.persist(Object.assign({},p.data,{casts:newCasts,folders:newFolders}));
    setEditFolderMode(false);setSelectedCastIds({});setTargetFolderId('');
    p.notify('フォルダを変更しました','success');
  }
  function addFolder(){
    var name=folderName.trim();if(!name)return;
    var newFolder={id:uid(),name:name,castIds:[]};
    p.persist(Object.assign({},p.data,{folders:[...folders,newFolder]}));
    setFolderName('');setShowAddFolder(false);p.notify(name+' フォルダを追加しました');
  }
  function deleteFolder(fid,name){
    if(!confirm(name+' フォルダを削除しますか？'))return;
    p.persist(Object.assign({},p.data,{folders:folders.filter(function(f){return f.id!==fid;})}));
  }
  function saveFolder(fid){
    p.persist(Object.assign({},p.data,{folders:folders.map(function(f){return f.id===fid?Object.assign({},f,{name:folderName}):f;})}));
    setEditFolderId(null);p.notify('フォルダ名を変更しました');
  }

  if(openFolder){
    var folder=folders.find(function(f){return f.id===openFolder;});
    if(!folder){setOpenFolder(null);return null;}
    var folderCasts=p.data.casts.filter(function(c){return(folder.castIds||[]).includes(c.id);});
    return e(FolderDetail,{folder:folder,folderCasts:folderCasts,data:p.data,onOpenCast:p.onOpenCast,notify:p.notify,uid:p.uid,onGoBack:p.onGoBack,onSetSubBack:p.onSetSubBack,onRestoreFolder:function(){setOpenFolder(openFolder);}});
  }

  return e('div',{style:{animation:'pageFadeIn 1.4s ease both'}},
    e('div',{style:S.pageTitle},
      e('button',{style:{background:'transparent',border:'none',padding:'2px 4px',cursor:'pointer',color:'#e8b86d',display:'flex',alignItems:'center',minWidth:'40px'},onClick:function(){if(p.onGoBack)p.onGoBack();}},e('svg',{width:20,height:20,viewBox:'0 0 24 24',fill:'none',stroke:'#e8b86d',strokeWidth:2.5,strokeLinecap:'round',strokeLinejoin:'round'},e('polyline',{points:'15 18 9 12 15 6'}))),
      e('h1',{style:{...S.h1,flex:1,textAlign:'center'}},'MG実績'),
      e('button',{style:{background:'transparent',border:'1px solid #374151',borderRadius:'8px',padding:'6px 10px',color:'#9ca3af',cursor:'pointer',display:'flex',alignItems:'center',minWidth:'40px',justifyContent:'center'},onClick:function(){if(p.onRefresh)p.onRefresh();}},e('svg',{width:16,height:16,viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:2,strokeLinecap:'round',strokeLinejoin:'round'},e('polyline',{points:'23 4 23 10 17 10'}),e('path',{d:'M20.49 15a9 9 0 1 1-2.12-9.36L23 10'})))
    ),
    e('div',{style:{display:'flex',gap:'8px',marginBottom:'10px',justifyContent:'flex-end'}},
        e('button',{style:S.btnPrimary,onClick:function(){setShowAddFolder(!showAddFolder);setEditFolderMode(false);}},showAddFolder?'キャンセル':'+ フォルダ追加'),
        e('button',{style:{background:editFolderMode?'#e8b86d22':'transparent',border:'1px solid '+(editFolderMode?'#e8b86d':'#4b5563'),borderRadius:'8px',padding:'6px 12px',color:editFolderMode?'#e8b86d':'#9ca3af',fontSize:'12px',fontWeight:700,cursor:'pointer'},

function CastListPage(p){

  var s_disp=useState(null);var addType=s_disp[0];var setAddType=s_disp[1]; // null=未選択,'regular'=在籍,'dispatch'=派遣
  var s7=useState(null);var editCast=s7[0];var setEditCast=s7[1];

  React.useEffect(function(){
    if(p.onSetSubBack){
      if(detail){p.onSetSubBack(function(){return function(){setDetail(null);setEditCast(null);return false;};});}
      else{p.onSetSubBack(null);}

    var list=p.data.casts.slice();
    if(sortBy==='name')list.sort(function(a,b){return a.name.localeCompare(b.name,'ja');});

    else if(sortBy==='height')list.sort(function(a,b){return Number(b.height||0)-Number(a.height||0);});
    return list;
  },[p.data.casts,sortBy]);

  var filtered=useMemo(function(){
    var q=query.trim().toLowerCase();
    if(!q)return sorted;
    return sorted.filter(function(c){
      return[c.name,c.realName,c.hometown,c.memo,c.contractShift,String(c.height||''),c.birthday?fmtDate(c.birthday):''].join(' ').toLowerCase().includes(q);

  function addCast(){
    var name=newName.trim();if(!name)return;
    var isDispatch=addType==='dispatch';
    var finalName=isDispatch?'派遣'+name:name;
    if(p.data.casts.find(function(c){return c.name===finalName;})){p.notify('同じ名前が既に存在します','error');return;}
    var id=Date.now().toString();

    var dispatchFolder=(p.data.folders||[]).find(function(f){return f.name==='派遣';});
    var isPersonalTarget=!isDispatch;
    var initFid;var finalCast;var finalFolders;
    if(isDispatch){
      initFid=dispatchFolder?dispatchFolder.id:'dispatch_folder';
    }else{

    if(isPersonalTarget&&!isDispatch){

        finalFolders=(p.data.folders||[]).map(function(f){if(f.id===pfId)return Object.assign({},f,{castIds:[...(f.castIds||[]),id]});return f;});
      }else{
        finalFolders=(p.data.folders||[]).concat([{id:pfId,name:'自分のフォルダ',castIds:[id],ownerUid:p.uid,_personal:true}]);
      }
    }else{

    var now2=new Date();

    var updated=p.data.casts.map(function(c){
      if(c.id!==id)return c;

    function tryAutoSignIn(){
      if(autoSignInAttempted)return;
      autoSignInAttempted=true;

      provider.setCustomParameters({'prompt':'none'});
      sessionStorage.setItem('mini_redirect_pending','1');

    function cleanupRooms(){
      if(unsubConsent){unsubConsent();unsubConsent=null;}
      if(unsubRooms){unsubRooms();unsubRooms=null;}
      if(unsubPersonalData){unsubPersonalData();unsubPersonalData=null;}

      personalDataRef.current={casts:[],records:{},customers:{},folders:[],shifts:{},visits:[],quota:{}};

    function rebuildData(){
      var map=roomDataMapRef.current;
      var pd=personalDataRef.current;
      var casts=[],records={},customers={},folders=[],shifts={},visits=[],quota={};
      Object.keys(map).forEach(function(rid){
        var d=map[rid]||{};
        (d.casts||[]).forEach(function(c){casts.push(Object.assign({},c,{_roomId:rid}));});
        Object.keys(d.records||{}).forEach(function(k){records[k]=d.records[k];});
        Object.keys(d.customers||{}).forEach(function(k){customers[k]=d.customers[k];});
        (d.folders||[]).forEach(function(f){folders.push(Object.assign({},f,{_roomId:rid}));});
        Object.keys(d.shifts||{}).forEach(function(k){shifts[k]=d.shifts[k];});
        visits=visits.concat((d.visits||[]).map(function(v){return Object.assign({},v,{_roomId:rid});}));
        Object.assign(quota,d.quota||{});
      });
      // ルームデータと重複しないようにIDで除外してからpersonalデータをマージ
      var roomCastIds=new Set(casts.map(function(c){return c.id;}));
      var roomFolderIds=new Set(folders.map(function(f){return f.id;}));
      (pd.casts||[]).forEach(function(c){
        if(!roomCastIds.has(c.id))casts.push(Object.assign({},c,{_personal:true}));
      });
      Object.keys(pd.records||{}).forEach(function(k){if(!roomCastIds.has(k))records[k]=pd.records[k];});
      Object.keys(pd.customers||{}).forEach(function(k){if(!roomCastIds.has(k))customers[k]=pd.customers[k];});
      (pd.folders||[]).forEach(function(f){
        if(!roomFolderIds.has(f.id)){
          var filteredCids=(f.castIds||[]).filter(function(cid){return !roomCastIds.has(cid);});
          folders.push(Object.assign({},f,{castIds:filteredCids,_personal:true}));
        }
      });
      Object.keys(pd.shifts||{}).forEach(function(k){if(!roomCastIds.has(k))shifts[k]=pd.shifts[k];});

        sessionStorage.removeItem('mini_expected_uid');
        autoSignInAttempted=false;
        cleanupRooms();auth.signOut();
        return;
      }
      if(u&&expectedUid&&u.uid===expectedUid){sessionStorage.removeItem('mini_expected_uid');}
      if(!u&&expectedUid){
        var rp=sessionStorage.getItem('mini_redirect_pending');
        if(!rp){tryAutoSignIn();return;}       // 初回: リダイレクト開始して待機

        sessionStorage.removeItem('mini_redirect_pending');

          var cd=doc.exists?doc.data():null;

            if(!consentDone){setConsentState('needed');consentDone=true;checkAllDone();}
          }else{
            setUserName(cd.userName||'');

          }
        },function(){if(!consentDone){setConsentState('needed');consentDone=true;checkAllDone();}});
        var loadedRids=new Set();
        var firstRoomsSnap=true;
        unsubRooms=db.collection('users').doc(u.uid).collection('rooms').onSnapshot(function(snap){
          var rooms=snap.docs.map(function(d){return Object.assign({roomId:d.id},d.data());});
          setRoomsList(rooms);
          if(rooms.length===0){
            rebuildData();
            if(firstRoomsSnap){firstRoomsSnap=false;roomsReady=true;checkAllDone();}
            return;
          }
          if(!primaryRoomRef.current)primaryRoomRef.current=rooms[0].roomId;
          var currentRids=new Set(rooms.map(function(r){return r.roomId;}));
          Object.keys(unsubDataMapRef.current).forEach(function(rid){
            if(!currentRids.has(rid)){
              unsubDataMapRef.current[rid]();delete unsubDataMapRef.current[rid];delete roomDataMapRef.current[rid];rebuildData();
            }
          });
          rooms.forEach(function(r){

            if(unsubDataMapRef.current[rid])return;
            unsubDataMapRef.current[rid]=db.collection('rooms').doc(rid).collection('data').doc('main').onSnapshot(function(doc){
              var d=doc.exists?doc.data():{};
              roomDataMapRef.current[rid]=Object.assign({casts:[],records:{},customers:{},folders:[],shifts:{},visits:[],quota:{}},d);
              loadedRids.add(rid);
              if(firstRoomsSnap&&loadedRids.size>=rooms.length){firstRoomsSnap=false;roomsReady=true;checkAllDone();}
              rebuildData();
            },function(){loadedRids.add(rid);if(firstRoomsSnap&&loadedRids.size>=rooms.length){firstRoomsSnap=false;roomsReady=true;checkAllDone();}});
          });
        },function(){if(firstRoomsSnap){firstRoomsSnap=false;roomsReady=true;checkAllDone();}});
