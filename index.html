// ─── Mini personal folder helper ─────────────────────────────────────────────
// When a user creates or joins a room, ensures a personal folder (ownerUid)
// exists in MG実績. Users add their own casts to this folder manually.
function setupPersonalCastInRoom(db,userUid,userName,roomId,roomName,roomData,uidFn,onDone){
  var folders=roomData.folders||[];
  var existing=folders.find(function(f){return f.ownerUid===userUid;});
  if(existing){onDone(roomData);return;}
  var folderName=userName||'メンバー';
  var newFolder={id:uidFn(),name:folderName,castIds:[],ownerUid:userUid};
  var newFolders=folders.concat([newFolder]);
  var updated=Object.assign({},roomData,{folders:newFolders});
  db.collection('rooms').doc(roomId).collection('data').doc('main').set({folders:newFolders},{merge:true}).catch(function(){});
  onDone(updated);
}
var calcAge=function(birthday){
  if(!birthday)return null;
  var parts=birthday.split('-');
  var now=new Date();var bd=new Date(Number(parts[0]),Number(parts[1])-1,Number(parts[2]));
  var age=now.getFullYear()-bd.getFullYear();
  if(now.getMonth()<bd.getMonth()||(now.getMonth()===bd.getMonth()&&now.getDate()<bd.getDate()))age--;
  return age;
};
var calcWorkDays=function(records,castId,scope){return(records[castId]||[]).filter(function(r){if(scope==='all')return true;if(scope.length===7)return r.date.slice(0,7)===scope;return r.date.slice(0,4)===scope;}).length;};

// キャストが指定月に所属していたフォルダIDを返す
function getCastFolderAt(cast,mk){
  if(!cast.folderHistory||cast.folderHistory.length===0){
    return null; // 履歴なし = 現在のフォルダで管理
  }
  // mkより前で最新のhistoryエントリを返す
  var sorted=cast.folderHistory.slice().sort(function(a,b){return a.from.localeCompare(b.from);});
  var result=null;
  for(var i=0;i<sorted.length;i++){
    if(sorted[i].from<=mk)result=sorted[i].folderId;
    else break;
  }
  return result;
}

function aggregate(records,castId,mode){
  var rows=records[castId]||[];var map={};
  rows.forEach(function(r){
    var key=mode==='daily'?r.date:mode==='monthly'?r.date.slice(0,7):r.date.slice(0,4);
    if(!map[key])map[key]={key:key,sales:0,companions:0,nominations:0,workDays:0,floorCount:0};
    map[key].sales+=Number(r.sales||0);map[key].companions+=Number(r.companions||0);
    map[key].nominations+=Number(r.nominations||0);map[key].workDays+=1;map[key].floorCount+=Number(r.floorCount||0);
  });
  return Object.values(map).sort(function(a,b){return a.key.localeCompare(b.key);});
}

function calcWorkHours(startTimeStr,endHour,endTimeStr,breakMinutes){
  if(!startTimeStr||(endHour==null&&!endTimeStr))return null;
  var pts=startTimeStr.split(':');if(pts.length<2)return null;
  var sh=parseInt(pts[0]),sm=parseInt(pts[1]);if(isNaN(sh)||isNaN(sm))return null;
  var startMin=sh*60+sm,endMin;
  if(endTimeStr){var ep=endTimeStr.split(':');endMin=parseInt(ep[0])*60+parseInt(ep[1]);}
  else{endMin=endHour*60;}
  if(endMin<=startMin)endMin+=1440;
  var diff=(endMin-startMin)/60-(breakMinutes?parseInt(breakMinutes):0)/60;
  if(diff<=0)return null;
  return diff.toFixed(1)+'h';
}

function getPrevMonth(ym){var d=new Date(ym+'-01');d.setMonth(d.getMonth()-1);return d.toISOString().slice(0,7);}
function calcMonthlyCastKPI(data,castId,yearMonth){
  var records=(data.records||{})[castId]||[];
  var monthly=records.filter(function(r){return r.date&&r.date.slice(0,7)===yearMonth;});
  var lastYM=getPrevMonth(yearMonth);
  var lastMonth=records.filter(function(r){return r.date&&r.date.slice(0,7)===lastYM;});
  var lastSales=lastMonth.reduce(function(s,r){return s+Number(r.sales||0);},0);
  return{
    salesTotal:monthly.reduce(function(s,r){return s+Number(r.sales||0);},0),
    workDays:monthly.length,
    nominationCount:monthly.reduce(function(s,r){return s+Number(r.nominations||0);},0),
    floorNominationCount:monthly.reduce(function(s,r){return s+Number(r.floorCount||0);},0),
    companionCount:monthly.reduce(function(s,r){return s+Number(r.companions||0);},0),
    lastMonthSales:lastSales||null
  };
}
function buildCustomerData(data,castId){
  var visits=(data.customers||{})[castId]||[];
  var grouped={};
  visits.forEach(function(v){
    if(!v.name)return;
    if(!grouped[v.name])grouped[v.name]={name:v.name,dates:[],types:[]};
    grouped[v.name].dates.push(v.date);
    grouped[v.name].types.push(v.type||'');
  });
  return Object.keys(grouped).map(function(k){
    var c=grouped[k];
    var sorted=c.dates.map(function(d){return new Date(d);}).sort(function(a,b){return b-a;});
    var avgInterval=30;
    if(sorted.length>=2){
      var intervals=[];
      for(var i=0;i<sorted.length-1;i++){intervals.push(Math.floor((sorted[i]-sorted[i+1])/86400000));}
      avgInterval=Math.round(intervals.reduce(function(a,b){return a+b;},0)/intervals.length);
    }
    return{name:c.name,nominationType:c.types[0]||'不明',visitCount:sorted.length,lastVisitDate:sorted[0]?sorted[0].toISOString().split('T')[0]:null,averageVisitInterval:avgInterval};
  }).filter(function(c){return c.lastVisitDate!==null;});
}
function buildSalesData(data,yearMonth){

  var prevYM=getPrevMonth(yearMonth);

  var prevRows=[];
  allCasts.forEach(function(c){
    (allRecords[c.id]||[]).forEach(function(r){
      if(r.date&&r.date.slice(0,7)===yearMonth)monthRows.push(r);
      if(r.date&&r.date.slice(0,7)===prevYM)prevRows.push(r);
    });
  });

  var totalSales=monthRows.reduce(function(s,r){return s+Number(r.sales||0);},0);
  var lastMonthSales=prevRows.reduce(function(s,r){return s+Number(r.sales||0);},0);
  var momRate=lastMonthSales>0?Math.round((totalSales/lastMonthSales)*100):null;
  var totalGuests=monthRows.reduce(function(s,r){return s+Number(r.guests||r.companions||0);},0);
  var totalCompanions=monthRows.reduce(function(s,r){return s+Number(r.companions||0);},0);

function calcAge(birthday){

  var birth=new Date(Number(parts[0]),Number(parts[1])-1,Number(parts[2]));
  var age=today.getFullYear()-birth.getFullYear();
  var m=today.getMonth()-birth.getMonth();

  return age;
}

function buildShiftData(data,yearMonth){

      monthActualDays:monthActualDays,actualWorkDays:actualWorkDays,

      totalNominations:totalNominations,topCustomerDays:topCustomerDays};

}
function estimateMonthlyDays(contractShift){

function buildAttendanceData(data,absenceData,yearMonth){

      ((absenceData[date].absences)||[]).forEach(function(a){
        if(a.castId!==cast.id)return;

    });
    var recs=((data.records||{})[cast.id]||[]).filter(function(r){return r.date&&r.date.startsWith(yearMonth);});
    var totalSales=recs.reduce(function(s,r){return s+Number(r.sales||0);},0);
    var avgSalesPerDay=monthActualDays>0?Math.round(totalSales/monthActualDays):0;

      monthActualDays:monthActualDays,pendingDays:pendingDays,absenceCount:absenceCount,
      tardyCount:tardyCount,totalSales:totalSales,avgSalesPerDay:avgSalesPerDay};

function buildVisitsData(data,yearMonth,openDate){

  birthdayPickups.sort(function(a,b){return a.daysUntilBd-b.daysUntilBd;});

function generateInviteCode(){
  var chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  var code='';
  for(var i=0;i<6;i++)code+=chars[Math.floor(Math.random()*chars.length)];
  return code;
}

  function doMiniSync(rid,rName,nextData){
    if(!user)return;
    var myFolder=(nextData.folders||[]).find(function(f){return f.ownerUid&&f.ownerUid===user.uid;});
    if(!myFolder)return;
    var miniRef=db.collection('users').doc(user.uid).collection('data').doc('main');
    miniRef.get().then(function(doc){
      var md=doc.exists?doc.data():{casts:[],records:{},customers:{},folders:[],shifts:{},visits:[],quota:{}};
      var miniCasts=md.casts||[];
      (myFolder.castIds||[]).forEach(function(castId){
        var cast=(nextData.casts||[]).find(function(c){return c.id===castId;});
        if(cast){
          var idx=miniCasts.findIndex(function(c){return c.id===castId;});
          if(idx>=0){miniCasts[idx]=cast;}else{miniCasts.push(cast);}
        }
      });
      var miniFolders=(md.folders||[]).slice();
      var linkedIdx=miniFolders.findIndex(function(f){return f.ownerUid===user.uid&&f.roomId===rid;});
      var folderName=rName||myFolder.name;
      if(linkedIdx>=0){
        miniFolders[linkedIdx]=Object.assign({},miniFolders[linkedIdx],{name:folderName,castIds:(myFolder.castIds||[]).slice()});
      }else{
        miniFolders.push({id:uid(),name:folderName,castIds:(myFolder.castIds||[]).slice(),ownerUid:user.uid,roomId:rid});
      }
      var upd={casts:miniCasts,folders:miniFolders};
      (myFolder.castIds||[]).forEach(function(castId){
        upd['records.'+castId]=nextData.records[castId]||[];
        upd['customers.'+castId]=nextData.customers[castId]||[];
      });
      if(doc.exists){
        miniRef.update(upd).catch(function(){});
      }else{
        var full={casts:miniCasts,records:{},customers:{},folders:miniFolders,shifts:{},visits:[],quota:{}};
        (myFolder.castIds||[]).forEach(function(castId){
          full.records[castId]=nextData.records[castId]||[];
          full.customers[castId]=nextData.customers[castId]||[];
        });
        miniRef.set(full).catch(function(){});
      }
    }).catch(function(){});
  }

  function submitJoinRequest(){
